name: Boston Terrier hourly watch
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boston-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install optional image classification dependencies
        run: |
          if grep -q '"type": "rss_visual"' config.json; then
            pip install -r requirements-vision.txt
          fi
      - name: Check public listings and send alerts
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: "587"
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python monitor.py
      - name: Save results for dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Boston Terrier watch results'
            git push
          fi
